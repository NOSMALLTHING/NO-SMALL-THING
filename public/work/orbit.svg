<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#5a3328"/><stop offset=".48" stop-color="#302925"/><stop offset="1" stop-color="#171719"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#242426"/><stop offset="1" stop-color="#19191b"/></linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="36" stdDeviation="40" flood-color="#000" flood-opacity=".35"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f0ece7" opacity=".1"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g fill="#e0d4c9" font-family="Arial,sans-serif"><text x="120" y="112" font-size="14" letter-spacing="4">ORBIT / INTERFACE STUDY</text><text x="1480" y="112" text-anchor="end" font-size="13" letter-spacing="3">CONCEPT — 2026</text></g>
  <g filter="url(#shadow)">
    <rect x="160" y="210" width="1280" height="600" rx="6" fill="url(#panel)" stroke="#56504b"/>
    <path d="M160 270H1440M380 270V810" stroke="#464344"/>
    <circle cx="187" cy="240" r="4" fill="#a27a66"/><circle cx="204" cy="240" r="4" fill="#82756d"/><circle cx="221" cy="240" r="4" fill="#655f59"/>
    <text x="800" y="246" text-anchor="middle" fill="#b5afa9" font-size="12" font-family="Arial,sans-serif" letter-spacing="2">ORBIT / WORKSPACE</text>
    <g font-family="Arial,sans-serif">
      <text x="196" y="332" fill="#f0ece7" font-size="27" letter-spacing="-1">orbit<tspan fill="#c87450">.</tspan></text>
      <text x="196" y="393" fill="#8b8680" font-size="10" letter-spacing="2">YOUR SPACE</text>
      <rect x="181" y="412" width="178" height="40" fill="#343031"/>
      <text x="198" y="438" fill="#f0ece7" font-size="13">Workflow canvas</text>
      <text x="198" y="483" fill="#97928c" font-size="13">Library</text>
      <text x="198" y="528" fill="#97928c" font-size="13">Settings</text>
      <text x="196" y="765" fill="#938b83" font-size="10" letter-spacing="1">DESIGN EXPLORATION</text>
    </g>
    <rect x="381" y="271" width="1058" height="538" fill="url(#grid)"/>
    <g font-family="Arial,sans-serif">
      <text x="430" y="337" fill="#f0ece7" font-size="24" letter-spacing="-.5">A clearer way forward.</text>
      <text x="430" y="367" fill="#96908a" font-size="13">Request → Draft → Human review</text>
      <rect x="1250" y="313" width="136" height="34" rx="17" fill="#332d28" stroke="#685044"/>
      <circle cx="1270" cy="330" r="3" fill="#c87450"/><text x="1282" y="335" fill="#d5b19b" font-size="10" letter-spacing="1">DRAFT FLOW</text>
    </g>
    <path d="M692 555H762M1002 555H1072" stroke="#a67d64" stroke-width="1.5"/>
    <g fill="#c87450"><circle cx="692" cy="555" r="4"/><circle cx="762" cy="555" r="4"/><circle cx="1002" cy="555" r="4"/><circle cx="1072" cy="555" r="4"/></g>
    <g font-family="Arial,sans-serif">
      <rect x="452" y="474" width="240" height="162" rx="4" fill="#272729" stroke="#5a5551"/>
      <text x="476" y="509" fill="#a9a099" font-size="10" letter-spacing="2">01 / INPUT</text><text x="476" y="552" fill="#f0ece7" font-size="21">New request</text><text x="476" y="584" fill="#9e9790" font-size="12">A starting point, in context.</text>
      <rect x="762" y="474" width="240" height="162" rx="4" fill="#332b27" stroke="#a16a4d"/>
      <text x="786" y="509" fill="#d1a78d" font-size="10" letter-spacing="2">02 / AI-ASSISTED</text><text x="786" y="552" fill="#f0ece7" font-size="21">Shape a draft</text><text x="786" y="584" fill="#b1a295" font-size="12">Structure before execution.</text>
      <rect x="1072" y="474" width="300" height="162" rx="4" fill="#272729" stroke="#5a5551"/>
      <text x="1096" y="509" fill="#a9a099" font-size="10" letter-spacing="2">03 / HUMAN DECISION</text><text x="1096" y="552" fill="#f0ece7" font-size="21">Review, then move</text><text x="1096" y="584" fill="#9e9790" font-size="12">People stay in the loop.</text>
      <text x="430" y="760" fill="#8d8780" font-size="11">A visual workflow concept. No live automation.</text>
    </g>
  </g>
  <text x="120" y="922" fill="#c1b2a6" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">HUMAN JUDGMENT. DIGITAL POSSIBILITY.</text>
</svg>
